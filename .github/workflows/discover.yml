name: discover

on:
  schedule:
    - cron: "43 10 * * *"    # daily, 10:43 UTC (~3:43am Pacific), off-peak minute
  workflow_dispatch:

concurrency:
  group: bumblebee-state
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    working-directory: bumblebee

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bumblebee/requirements.txt
      - run: pip install -r requirements.txt
      - name: Restore state
        run: bash scripts/restore_state.sh
      - name: Restore HTTP cache
        uses: actions/cache@v4
        with:
          path: bumblebee/data/http_cache
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-
      - name: Discover companies
        env:
          LOG_FORMAT: json
        run: python -m bumblebee discover
      - name: Save state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/save_state.sh
