name: check-jobs

on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub may delay scheduled runs by several minutes under load
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print messages instead of sending"
        type: boolean
        default: false

# check-jobs and discover both write the DB; never run them concurrently.
concurrency:
  group: job-alert-state
  cancel-in-progress: false

permissions:
  contents: write   # push the state branch

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore state
        run: bash scripts/restore_state.sh
      - name: Restore HTTP cache (large GitHub listing files, ETag-validated)
        uses: actions/cache@v4
        with:
          path: data/http_cache
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-
      - name: Check jobs
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MY_PHONE_NUMBER: ${{ secrets.MY_PHONE_NUMBER }}
          MY_CARRIER: ${{ secrets.MY_CARRIER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          LOG_FORMAT: json
        run: python -m job_alert run ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Save state
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/save_state.sh
